services:
  - type: web
    name: greenlens-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: IDENTIFICATION_MODE
        value: real
      - key: BIRD_MIN_CONFIDENCE
        value: "0.30"
      - key: PLANTNET_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
