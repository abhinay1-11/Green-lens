services:
  - type: web
    name: greenlens-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: IDENTIFICATION_MODE
        value: real
      - key: BIRD_MIN_CONFIDENCE
        value: "0.30"
      - key: BIRD_IDENTIFICATION_PROVIDER
        value: local_onnx
      - key: INSECT_IDENTIFICATION_PROVIDER
        value: local_onnx
      - key: PLANTNET_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
